[project]
name = "abm-auto"
version = "0.1.0"
description = "Autonomous Agent-Based Modeling research pipeline powered by ABM Auto Runtime + Claude"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "SALib>=1.5.0",
    "openai>=2.38.0",
    "scikit-learn>=1.8.0",
]

[project.scripts]
abm-auto = "abm_auto.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0.0"]
