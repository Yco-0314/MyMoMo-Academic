[project]
name = "abm-auto"
version = "0.4.0"
description = "Autonomous Agent-Based Modeling research pipeline powered by ABM Auto Runtime + Claude"
keywords = ["agent-based-modeling", "abm", "simulation", "social-science", "llm", "research"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pandas>=2.0.0",
    "networkx>=3.0",
    "requests>=2.28.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "SALib>=1.5.0",
    "openai>=2.38.0",
    "scikit-learn>=1.8.0",
]

[project.optional-dependencies]
# ADR-021 D5: cross-tool BenchmarkAdapter (MesaBaseline). NetLogo stays an external
# install gated by netlogo_oracle.is_available(). `pip install abm-auto[benchmarks]`.
benchmarks = ["mesa>=2.0"]
# GIS mode (additive). Heavy/GDAL-adjacent; kept out of the base install.
# `pip install abm-auto[gis]`.
gis = ["rasterio>=1.3", "pyproj>=3.5", "geopandas>=0.14", "shapely>=2.0"]

[project.scripts]
abm-auto = "abm_auto.cli:app"
mymomo = "abm_auto.cli:app"

[project.urls]
Homepage = "https://github.com/Yco-0314/MyMoMo-Academic"
Repository = "https://github.com/Yco-0314/MyMoMo-Academic"
Issues = "https://github.com/Yco-0314/MyMoMo-Academic/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["abm_auto"]
exclude = ["abm_auto/gis", "**/__pycache__", "**/*.pyc", "**/.DS_Store"]

[tool.hatch.build.targets.sdist]
exclude = ["abm_auto/gis", "workspace", ".env", "**/__pycache__", "**/*.pyc", "**/.DS_Store"]

[dependency-groups]
dev = ["pytest>=8.0.0"]
